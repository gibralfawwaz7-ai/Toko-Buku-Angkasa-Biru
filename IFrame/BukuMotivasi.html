<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Buku Motivasi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 25px;
      color: #1e3a5f;
    }

    /* Container Grid */
    .container-buku {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      justify-content: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Styling Kartu */
    .card-buku {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-buku:hover {
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    /* Area Gambar */
    .img-container {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
      border-radius: 6px;
    }

    .img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      border-radius: 5px;
    }

    /* Tombol/Label Harga (Format Link ke Pembayaran) */
    .price-btn {
      display: inline-block;
      width: 100%;
      background-color: #1e3a5f;
      color: #ffffff;
      font-weight: bold;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    /* Efek Membesar (Scale) saat Hover */
    .price-btn:hover {
      transform: scale(1.08);
      background-color: #2b5288;
    }
  </style>
</head>
