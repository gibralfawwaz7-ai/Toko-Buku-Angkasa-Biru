<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Novel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 25px;
      color: #1e3a5f;
    }

    .container-buku {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      justify-content: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card-buku {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-buku:hover {
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .img-container {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
      border-radius: 6px;
    }

    .img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      border-radius: 5px;
    }

    .title-buku {
      font-size: 15px;
      font-weight: bold;
      color: #1e3a5f;
      margin-bottom: 10px;
    }

    /* Tombol Pembayaran / Harga */
    .price-btn {
      display: block;
      width: 100%;
      background-color: #1e3a5f;
      color: #ffffff;
      font-weight: bold;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
      text-align: center;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .price-btn:hover {
      transform: scale(1.08);
      background-color: #2b5288;
    }
  </style>
</head>
<body>

  <h1>Buku-buku novel dengan harga murah dan cerita terbaik!</h1>

  <div class="container-buku">

    <div class="card-buku">
      <div class="img-container">
        <img src="GAMBAR/Novel_SHC.jpg" alt="Senja, Hujan, & Cerita">
      </div>
      <div class="title-buku">Senja, Hujan, & Cerita</div>
      <!-- Link langsung menuju Halaman Pembayaran di dalam iframe -->
      <a href="Pembayaran.html?title=Senja,%20Hujan,%20&%20Cerita&price=65.000" class="price-btn">Beli - Rp 65.000</a>
    </div>

    <div class="card-buku">
      <div class="img-container">
        <img src="GAMBAR/Novel_YKC.jpg" alt="Yang Katanya Cemara">
      </div>
      <div class="title-buku">Yang Katanya Cemara</div>
      <a href="Pembayaran.html?title=Yang%20Katanya%20Cemara&price=79.000" class="price-btn">Beli - Rp 79.000</a>
    </div>

    <div class="card-buku">
      <div class="img-container">
        <img src="GAMBAR/Novel_Hujan.jpg" alt="Novel Hujan">
      </div>
      <div class="title-buku">Novel Hujan</div>
      <a href="Pembayaran.html?title=Novel%20Hujan&price=60.000" class="price-btn">Beli - Rp 60.000</a>
    </div>

    <div class="card-buku">
      <div class="img-container">
        <img src="GAMBAR/Motivasi_SAW.jpg" alt="Motivasi SAW">
      </div>
      <div class="title-buku">Buku Motivasi SAW</div>
      <a href="Pembayaran.html?title=Buku%20Motivasi%20SAW&price=65.000" class="price-btn">Beli - Rp 65.000</a>
    </div>

    <div class="card-buku">
      <div class="img-container">
        <img src="GAMBAR/Motivasi_AKPdM.jpg" alt="Aku, Kau, dan Masa Depan">
      </div>
      <div class="title-buku">Aku, Kau, & Masa Depan</div>
      <a href="Pembayaran.html?title=Aku,%20Kau,%20&%20Masa%20Depan&price=45.000" class="price-btn">Beli - Rp 45.000</a>
    </div>

    <div class="card-buku">
      <div class="img-container">
        <img src="GAMBAR/Motivasi_RM.jpg" alt="Rencana Manusia">
      </div>
      <div class="title-buku">Rencana Manusia</div>
      <a href="Pembayaran.html?title=Rencana%20Manusia&price=60.000" class="price-btn">Beli - Rp 60.000</a>
    </div>

  </div>

</body>
</html>
